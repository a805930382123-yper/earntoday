name: Windows signed updater release

# A push must never publish a version to existing users.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Output (candidate only until real upgrade tests have passed)
        type: choice
        options: [candidate, prerelease]
        default: candidate

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and test existing calculations
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare signed build (fail closed without secrets)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY first; do not publish unsigned updater builds' }
          node tools/prepare-updater.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and sign Windows NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri -- build --bundles nsis --ci --config src-tauri/tauri.updater.generated.json -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/prepare-release.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual v0.2.0 upgrade in a fresh Windows runner
        run: |
          Invoke-WebRequest 'https://github.com/a805930382123-yper/earntoday/releases/download/v0.2.0/EarnToday_0.2.0_x64-setup.exe' -OutFile "$env:RUNNER_TEMP/old-0.2.0.exe"
          $hash = (Get-FileHash "$env:RUNNER_TEMP/old-0.2.0.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '78386390e755b6eac3e878dc4ab5552fe5ffd7067e9809a2b2816769330c640c') { throw 'Old installer hash mismatch' }
          $installer = @(Get-ChildItem "release-assets/*-setup.exe")
          if ($installer.Count -ne 1) { throw 'Expected one current installer' }
          node tools/verify-upgrade.mjs "$env:RUNNER_TEMP/old-0.2.0.exe" $installer[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-candidate
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: windows
    if: inputs.publish != 'candidate'
    runs-on: windows-2022
    environment: updater-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-candidate
          path: release-assets
      - name: Publish only on explicit request
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_MODE: ${{ inputs.publish }}
        run: |
          $version = (Get-Content release-assets/latest.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Version already exists; do not replace signed release assets' }
          $flags = @('--prerelease', '--latest=false')
          gh release create $tag (Get-ChildItem release-assets -File).FullName --target $env:GITHUB_SHA --title "今天又赚了多少 $tag" --notes-file release-assets/release-notes.md @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
